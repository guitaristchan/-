<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딴 짓 하면 죽는다</title>
    <style>
        .cook-gif {
            position: fixed; 
            bottom: 20px; 
            right: 20px;
            width: 140px !important; /* 모바일 크기 강제 */
        }

        @media (min-width: 768px) {
            .cook-gif {
                width: 35px !important; /* PC 화면에서 1/4 크기로 강제 줄임 */
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; text-align: center;">



    <h1 style="font-size: 14px; margin-top: 20px; color: black; font-family: sans-serif;">딴 짓 하면 죽는다</h1>
    
    <!-- img 태그 안에 width="140" 이나 style="..." 이 절대 없어야 합니다 -->
    <img src="cook.gif" alt="경고" class="cook-gif">

</body>
</html>
