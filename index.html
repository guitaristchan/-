<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딴 짓 하면 죽는다</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        h1 {
            color: #ff0000; /* 경고 느낌을 주기 위해 빨간색 적용 */
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px; /* 이미지 모서리를 살짝 부드럽게 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* 입체감 효과 */
        }
    </style>
</head>
<body>

    <h1>딴 짓 하면 죽는다</h1>
    <img src="cook.gif" alt="딴짓 방지 움짤">

</body>
</html>
