<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딴 짓 하면 죽는다</title>
    <style>
        /* 기본(모바일) 이미지 설정: 140px */
        .cook-gif {
            width: 140px;
            position: fixed; 
            bottom: 20px; 
            right: 20px;
        }

        /* PC 화면(가로 해상도 768px 이상)일 때 적용되는 설정: 1/4 크기인 35px */
        @media (min-width: 768px) {
            .cook-gif {
                width: 35px; /* 140px의 1/4 크기 */
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; text-align: center;">

    <!-- 배경 음악 자동 재생 및 반복 -->
    <audio src="오디오/White christmas.mp3" autoplay loop></audio>

    <!-- 화면 상단 텍스트 -->
    <h1 style="font-size: 14px; margin-top: 20px; color: black; font-family: sans-serif;">딴 짓 하면 죽는다</h1>
    
    <!-- 우측 하단 GIF 이미지: width 속성과 style 속성을 지우고 class만 남겨야 CSS가 적용됩니다. -->
    <img src="cook.gif" alt="경고" class="cook-gif">

</body>
</html>
