<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딴 짓 하면 죽는다</title>
    <style>
        .cook-gif {
            position: fixed; 
            bottom: 20px; 
            right: 20px;
            /* 강제 크기 확대를 막기 위해 width 관련 속성을 모두 제거했습니다 */
            image-rendering: pixelated; /* 도트 이미지가 브라우저 배율에 의해 흐려지지 않고 선명하게 보이도록 보호 */
        }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; text-align: center;">

    <audio src="오디오/White christmas.mp3" autoplay loop></audio>

    <h1 style="font-size: 14px; margin-top: 20px; color: black; font-family: sans-serif;">딴 짓 하면 죽는다</h1>
    
    <!-- HTML 태그에서도 width 속성을 완전히 지워서 파일 원본 해상도 1:1 그대로 출력되게 합니다 -->
    <img src="cook.gif" alt="경고" class="cook-gif">

</body>
</html>
